  full_name: AartiLakshmi/fluffy-octo-eureka
  url: https://github.com/AartiLakshmi/fluffy-octo-eureka
  description: 'About us Miranda''s Rescue Board of Directors      Shannon Miranda - President / Founder ​     Brian
    Paris - Treasurer / DM  Large Animal & Exotic Animal Adoption/Rescue      Shannon Miranda  Dog & Cat Adoption/Rescue      Manager
    - Shannon Miranda       Office Manager - Maria  Website      Chris      Dog Training      Shannon      Kimber  Ranch
    Hands       James       Mikayla       Blake        Logan       Dylan        Stephanie       Thomas       Mike
    - (handyman)       Curtis  Equine       Mikayla       Roseann ​      Thomas       Stephanie       Dylan  Cute
    Little Critter Foster Care       Granny  Puppy & Kitten Foster Moms       Kat       Laney  Farriers       Roy
    Equine       Ian - Equine / Large Livestock       Jessica - Mini''s / Goats  Shearer       Shannon       Kevin   Veterinarians       Riverwalk
    Veterinary Hospital       Ferndale Vet & Fortuna Vet  We bid a fond farewell to our Rescue Mascot Skyy, a 180lb
    Harlequin Great Dane. Skyy could be found wagging his tail all day long around the rescue grounds. He was just
    a big happy-go-lucky guy who loved everyone! We miss you terribly big boy and our lives will never be the same
    without you. Shown below was one of his favorite things...getting a massage from our friend Kimber; and he loved
    to curl up in small dogs beds. That was Skyy, a silly goofy good boy. Dear sweet ole'' buddy, now you have no
    more pain in your hips and now you can jump and play all you want in Doggie Paradise. Much love from your Miranda
    Rescue Family. Rest in Peace 2007 - 2015. Miranda''s Rescue For Large & Small Animals is a no-kill rescue, adoption
    & sanctuary facility that brings relief to hundreds of distressed, neglected, abused & discarded animals, large
    & small, every year. We are a non-profit 501 (c) (3) tax-exempt public charity organziation, EIN #68-0417389.  Miranda''s
    Rescue is a 50 acre facility with 30 working acres. We are located on the corner of Drake Hill & Sandy Prairie
    Roads. Our property is divided into two sections. The Drake Hill Road Entrance houses our wonderful, hugable
    and adoptable dogs, puppies, cats & kittens while the Sandy Prairie Road Entrance houses the large & small animals
    up for adoption as well as sanctuary animals.  We rescue dogs, cats, horses, reptiles, small mammals, domestic
    and game birds, tropical birds, livestock, & exotic animals such as alpacas, emus & llamas and many whatever
    other critter needs our help and we can accommodate. Some of our animals have found permanent refuge at our
    facility. Click our Link on the left "Sanctuary". There''s no type of animal that we won''t rescue. We''ve even
    had camels residing here before. Many of the animals are adopted out to loving homes while others live permanently
    on the rescue grounds as sanctuary residents.  Miranda''s Rescue has been recognized by the California State
    Assembly as the "Best Sanctuary For Abused Animals in Northern California" & the Red Cross named founder, Shannon
    Miranda, one of "Humboldt County''s Heroes". The California State Assembly also recognized Shannon for his help
    with the probation youth of Humboldt County.  Many people do not know the difference between a shelter and a
    rescue/sanctuary. WE ARE A RESCUE/SANCTUARY not a shelter. Hopefully this clears up any confusion.  ANIMAL SHELTER
    VS. ANIMAL RESCUE/SANCTUARY:  ANIMAL SHELTER: Shelters are government funded. This means that all expenses like
    vaccines, flea, worming, heart guard prevention and spay/neuter are paid for at a low cost by the government.
    When an animal at a shelter becomes ill or the shelter is too full, the only outcome is euthanasia. This is
    to prevent the spread of disease in the shelter and to make room for new animals otherwise millions of animals
    would be dumped alongside the road. It''s less costly to just "get rid" of the problem then to treat. The government
    simply does not allow the funding to treat all of the animals in need.  WE ARE AN ANIMAL RESCUE AND SANCTUARY:
    An animal rescue/sanctuary takes on the expense at full cost and also doesn''t euthanize just because an animal
    becomes ill or to make room for new animals. When our rescue is full, we don''t take in any new animals. Adoptable
    animals stay at our sanctuary until we find a loving and permanent forever home. We reserve humane euthanasia
    for terminally ill animals due to disease, injury or suffering that can''t be alleviated and for animals that
    show signs of a behavioral or temperamental defect that can''t be rehabilitated where placement would constitue
    a danger to the public or animals who would pose a public health hazard. The term unadoptable will vary between
    individual municipalities and rescues. Any humane euthanasia is performed and approved by licensed veterinarian
    clinics who are very well known and respected in our community. Our rescue always has and always will do everything
    possible to save an animal''s life!  WE RECEIVE NO GOVERNMENT FUNDING: Government funding is reserved for an
    animal shelter. We are an animal rescue. We have two city contracts with Fortuna and Ferndale that is "City
    Funded" not Federally Funded. Hopefully this clears up any confusion. Per these contracts, we take in any animal
    that is turned-in or picked up by local law enforcement in these two cities. Any wildlife is picked-up by the
    Wildlife Care Center.  OUR RESCUE OPERATES FINANCIALLY with proceeds from our thrift shops in Fortuna, Eureka,
    McKinleyville & Garberville along with adoption fees, creative and innovative fundraising projects & donations
    from the private sector.  Ways you can make a monetary donation: 1.) Click on the donate tab on our website
    to donate via paypal and to see a list of other ways you can donate. 2.) Call our Treasurer, Dean, 707.616.5018
    with a credit card over the phone. 3.) Stop by one of our thrift stores and leave a check or cash at the front
    counter. 4.) You can mail a check to Mirandas Rescue, 1603 Sandy Prairie Rd. Fortuna, CA  95540. All funds are
    directly deposited into Miranda''s Rescue Primary Nonprofit Business Account.  The rescue would not be where
    it is today without its hardworking and dedicated staff & volunteers. Presently the rescue has 7 full and/or
    part time employees plus 1 outreach/county paid employess with an ongoing rotation of 20 part-time part-time
    volunteers! This does not include volunteers who stop by randomly or in outreach groups which totals over 100.
    Our 4 thrift stores have 17 (mostly part-time employees), 1 County paid employee and anywhere from 40-70 full
    and part-time volunteers throughout the year. Bless all of you for believing in the rescue''s mission...to save
    as many animals as we possibly can! Whether you made a contribution, adopted one of our furry companions, transported
    animals, shopped at one of our stores, worked at an event, cleaned a horse stall, walked a dog, cleaned an enclosure
    or kennel, sorted clothing or answered phones we want to sincerely say to you - THANK YOU for your support in
    helping make our community a better place to live.'
